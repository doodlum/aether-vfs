name: vortex-artifacts
# What Vortex ships of aether-vfs: the Node binding and the shim, built in release mode and
# published as the assets of one release per commit (`vortex-<sha>`). Vortex pins a release by
# its file names and SHA-256 sums (src/main/copy-assets.mjs in doodlum/Vortex), so a published
# release is never replaced: a new commit publishes a new one.
on:
  push:
    branches: ["vortex-*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          # The 32-bit shim and injector, for 32-bit games (Fallout 3, New Vegas, Oblivion).
          targets: i686-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            rust
            bindings/node
      - name: Build the shim
        run: cargo build --release -p vfs-shim-dll
        working-directory: rust
      - name: Build the 32-bit shim and injector
        run: cargo build --release --target i686-pc-windows-msvc -p vfs-shim-dll -p vfs-inject --bin vfs-injector --lib
        working-directory: rust
      - name: Build the Node binding
        run: cargo build --release
        working-directory: bindings/node
      - name: Collect the artifacts
        shell: pwsh
        run: |
          $out = New-Item -ItemType Directory -Force -Path dist
          Copy-Item bindings/node/target/release/aether_vfs_node.dll "$out/aether_vfs_node-win32-x64.node"
          Copy-Item rust/target/release/vfs_shim_dll.dll "$out/vfs_shim_dll-win32-x64.dll"
          # Vortex installs these two as x86\vfs_shim_dll.dll and x86\vfs-injector.exe beside
          # the 64-bit shim (vfs_embed::X86_ARTIFACTS_DIR).
          Copy-Item rust/target/i686-pc-windows-msvc/release/vfs_shim_dll.dll "$out/vfs_shim_dll-win32-ia32.dll"
          Copy-Item rust/target/i686-pc-windows-msvc/release/vfs-injector.exe "$out/vfs-injector-win32-ia32.exe"
          Get-ChildItem $out | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          } | Set-Content -Encoding ascii "$out/SHA256SUMS-win32-x64.txt"
          Get-Content "$out/SHA256SUMS-win32-x64.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: dist/*

  # Linux: the binding, and `fusermount-relay` for a Flatpak (vfs-fuse). Roots are FUSE mounts
  # there, so there is no shim to ship; the user's machine needs fusermount3 (package fuse3), not
  # libfuse headers.
  linux-x64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          # The relay runs on the host of a Flatpak, outside its runtime: static, with musl.
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            rust
            bindings/node
      - name: Build the Node binding
        run: cargo build --release
        working-directory: bindings/node
      - name: Build the relay
        run: cargo build --release --target x86_64-unknown-linux-musl -p vfs-fuse --bin fusermount-relay
        working-directory: rust
      - name: Collect the artifacts
        run: |
          mkdir -p dist
          cp bindings/node/target/release/libaether_vfs_node.so dist/aether_vfs_node-linux-x64.node
          cp rust/target/x86_64-unknown-linux-musl/release/fusermount-relay dist/fusermount-relay-linux-x64
          strip dist/fusermount-relay-linux-x64
          (cd dist && sha256sum aether_vfs_node-linux-x64.node fusermount-relay-linux-x64 > SHA256SUMS-linux-x64.txt)
          cat dist/SHA256SUMS-linux-x64.txt
      - uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: dist/*

  publish:
    needs: [windows-x64, linux-x64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="vortex-${GITHUB_SHA::12}"
          if gh release view "$tag" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "$tag already published; a release is never replaced"
            exit 0
          fi
          gh release create "$tag" dist/* -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --prerelease --title "Vortex artifacts ${GITHUB_SHA::12}" \
            --notes "aether-vfs for Vortex, built from ${GITHUB_REF_NAME} at ${GITHUB_SHA}."
